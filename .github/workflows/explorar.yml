name: explorar
on: { workflow_dispatch: {}, push: { paths: ['.github/workflows/explorar.yml'] } }
jobs:
  e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          python3 - <<'PY'
          import sys; sys.path.insert(0,'ingesta')
          from premios import wikitexto
          import re
          for t in ["AP NFL Defensive Rookie of the Year","AP NFL Offensive Rookie of the Year"]:
              w=wikitexto(t); print("=====",t,len(w)); print(re.findall(r"\n(=+[^=\n]+=+)",w))
              i=w.find("2012 NFL season"); print(w[i-300:i+500])
          PY
